[tool.poetry]
name = "python-template"
version = "0.3.0"
description = "Python project template with logging, .env settings, pytest, and Ruff."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
  { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.12"
pydantic-settings = "^2.5"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^5.0"
ruff = "^0.15"
mypy = "^1.11"
pre-commit = "^3.4"
commitizen = "^4.4"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
exclude = ["logs", "tests/__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "N"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["logs", "build", "dist", ".venv"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov=main --cov-report=term-missing"

# commitizen is kept only for Conventional Commits validation via the
# commit-msg pre-commit hook. Versioning, tagging and CHANGELOG.md are owned by
# release-please in CI (.github/workflows/release-please.yml) — do not run
# `cz bump` locally, it would conflict with the release PR.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "poetry"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = false
