[tool.poetry]
name = "python-template"
version = "0.1.0"
description = "Python project template with logging, .env settings, pytest, and Ruff."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
  { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.12"
pydantic-settings = "^2.5"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
ruff = "^0.0"
pre-commit = "^3.4"
commitizen = "^4.4"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "N"]
exclude = ["logs", "tests/__pycache__", ".venv", "build", "dist"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "poetry"
tag_format = "v$version"
major_version_zero = true
# Changelog is generated by git-cliff in CI (.github/workflows/release.yml)
# on tag push — keep this disabled to avoid double-writes.
update_changelog_on_bump = false
bump_message = "bump: version $current_version -> $new_version"
